name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST     — 홈서버 외부 IP 또는 도메인 (예: ssc-api.kknaks.cloud)
#   SSH_USER     — ssh 접속 user (예: kknaks)
#   SSH_KEY      — 홈서버 ~/.ssh/authorized_keys 에 등록된 키쌍의 PRIVATE 키 전체 내용
#   SSH_PORT     — (선택) 비표준 포트면 입력, 기본 22
#   PROD_ENV     — 운영 .env 파일 내용 통째로 (multiline secret)
#                  포함: POSTGRES_USER/PASSWORD/DB, JWT_SECRET, AGENT_API_KEY,
#                       CORS_ORIGINS, READER_NAME, READER_TIMEOUT_SEC 등
#                  → 매 배포마다 서버의 .env 가 이 값으로 갱신됨
#
# 홈서버 사전 셋업 (1회):
#   1. mkdir -p /home/kknaks/ssc && cd /home/kknaks/ssc
#   2. docker-compose.yml + docker-compose.prod.yml 두 파일을 서버에 복사 (scp / 직접 작성)
#   3. echo $GH_PAT | docker login ghcr.io -u kknaks --password-stdin   (PAT scope: read:packages)
#   4. ~/.ssh/authorized_keys 에 GH Actions용 deploy key 추가
#   5. 첫 배포는 GH Actions workflow_dispatch 로 트리거 (.env 자동 생성됨)
#
# 이후 compose 파일이 바뀌면 → 서버에서 직접 갱신 (이 워크플로우는 image + .env 만 갱신)

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/summer-star-backend:latest
            ghcr.io/${{ github.repository_owner }}/summer-star-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PROD_ENV
          script: |
            set -euo pipefail
            mkdir -p /home/kknaks/ssc
            cd /home/kknaks/ssc
            curl -fsSL -o docker-compose.prod.yml \
              https://raw.githubusercontent.com/kknaks/summer_star_company/main/docker-compose.prod.yml
            umask 077
            printf '%s' "$PROD_ENV" > .env
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
